<!doctype html>
<html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Laporan PPM - Banjaria Court</title><link rel="stylesheet" href="ppm-reports.css?v=20261019-3"></head>
<body><main class="reports-shell">
<nav class="reports-nav"><a href="technical.html">← Dashboard Teknikal</a><a href="ppm-form.html">Borang PPM</a></nav>
<header><p class="eyebrow">TEKNIKAL / REKOD PEMERIKSAAN</p><h1>Laporan PPM</h1><p>Semak rekod yang diterima server dan muat turun laporan PDF.</p></header>
<p id="reportStatus" role="status">Memuatkan rekod server...</p>
<section class="filters" aria-label="Tapis laporan">
<label>Bulan<input id="monthFilter" type="month"></label>
<label>Kategori<select id="categoryFilter"><option value="">Semua kategori</option></select></label>
<label>Templat<select id="templateFilter"><option value="">Semua templat</option></select></label>
<label>Lokasi / Carian<input id="searchFilter" type="search" placeholder="Lokasi, rujukan atau ID"></label>
<button type="button" id="refreshReports">Muat semula</button><button type="button" id="clearFilters">Kosongkan penapis</button>
</section>
<p id="reportCount" aria-live="polite"></p><div id="reportList" class="report-list"></div>
<dialog id="reportDialog" aria-labelledby="previewTitle"><div class="preview-toolbar"><h2 id="previewTitle">Laporan PPM</h2><button type="button" id="downloadPdf">Muat Turun PDF</button><button type="button" id="closePreview">Tutup</button></div><p id="pdfStatus" role="status"></p><article id="reportPreview"></article></dialog>
</main><script src="backend-config.js"></script><script src="vendor/jspdf.umd.min.js"></script><script src="vendor/jspdf.plugin.autotable.min.js"></script><script src="ppm-report-templates.js?v=20261019-2"></script><script src="ppm-reports.js?v=20261019-4"></script></body></html>
